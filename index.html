function path(){return '/rest/v1/atelier_vault_v1?owner_id=eq.'+encodeURIComponent(session.user.id)}
async function readRemote(){const t=await bearer();const rows=await request(path()+'&select=revision,payload','GET',null,t);return rows[0]||null}
function settings(){cs('login').hidden=!!session;cs('actions').hidden=!session;cs('upload').hidden=!!meta&&!blocked;cs('pull').hidden=!remoteRow;cs('disconnect').hidden=!session&&!localStorage.getItem(loginId)}
function warn(e){message(e.status===429?'Zu viele Anfragen. Versuche es später erneut.':e.status===401||e.status===403?'Anmeldung oder Freigabe fehlt. Trenne die Verbindung und melde dich mit deinem bestätigten Konto an.':e.status===400?'Der Zugang ist ungültig oder abgelaufen. Fordere bei Bedarf eine neue E-Mail an.':'Online-Speicherung unterbrochen. Lokale Eingaben bleiben erhalten. Verbindung prüfen und erneut versuchen.')}
async function inspect(){remoteRow=await readRemote();blocked=!!meta&&(remoteRow?.revision||0)!==meta.rev;settings();if(blocked)message('Auf einem anderen Gerät liegt ein neuerer Stand. Wähle, welche Fassung gelten soll.');else if(!meta)message(remoteRow?'Online-Stand vorhanden. Wähle bewusst zwischen dem Online-Stand und deinen bisherigen lokalen Einträgen.':'Noch keine Online-Kopie. Erst «Lokalen Stand hochladen» überträgt deine bisherigen Einträge.');else schedule()}
function schedule(){clearTimeout(timer);if(meta&&!blocked&&session)timer=setTimeout(()=>sync().catch(warn),900)}
async function sync(){if(busy||!meta||blocked||!session)return;busy=true;let snapshot,ver;try{await last;if(failed)throw Error();snapshot=memory;if(!snapshot)return;const fingerprint=await digest(snapshot);if(fingerprint===meta.hash){message('Synchronisiert · Änderungen werden automatisch gespeichert.');return}ver=meta.rev;const payload=await seal(snapshot),token=await bearer();let rows;try{rows=await request(ver?path()+'&revision=eq.'+ver:'/rest/v1/atelier_vault_v1',ver?'PATCH':'POST',ver?{revision:ver+1,payload}:{owner_id:session.user.id,revision:1,payload},token,{Prefer:'return=representation'})}catch(e){if(e.status!==409)throw e;rows=[]}if(!rows?.length){blocked=true;remoteRow=await readRemote();settings();message('Versionskonflikt. Beide Fassungen bleiben erhalten. Wähle den gewünschten Stand.');return}meta={rev:rows[0].revision,hash:fingerprint};localStorage.setItem(metaId,JSON.stringify(meta));remoteRow=rows[0];message('Online gespeichert · Version '+meta.rev);settings()}finally{busy=false;if(snapshot&&snapshot!==memory)schedule()}}
function backup(){const packed=localStorage.getItem(stateId);if(packed)localStorage.setItem(stateId+'-before-cloud',packed)}
async function takeRemote(){const row=await readRemote();if(!row)return message('Noch keine Online-Kopie.');const data=await openPacket(row.payload);JSON.parse(data);if(!confirm('Online-Stand auf diesem Gerät übernehmen? Exportiere bei Bedarf vorher dein lokales Lernjournal.'))return;await last;backup();localStorage.setItem(stateId,row.payload);localStorage.setItem(metaId,JSON.stringify({rev:row.revision,hash:await digest(data)}));location.reload()}
async function upload(){const row=await readRemote();if((row?.revision||0)!==(remoteRow?.revision||0)){remoteRow=row;settings();return message('Online-Stand inzwischen geändert. Bitte Auswahl erneut prüfen.')}if(!confirm(row?'Online-Stand durch alle aktuellen lokalen Einträge ersetzen und künftig automatisch synchronisieren?':'Alle bisherigen Antworten und Notizen verschlüsselt hochladen und künftig automatisch synchronisieren?'))return;meta={rev:row?.revision||0,hash:''};blocked=false;await sync()}
async function afterLogin(res){await keepSession(res);cs('proof').value='';await inspect()}
async function bootCloud(){cloud.hidden=false;try{meta=JSON.parse(localStorage.getItem(metaId)||'null');settings();if(localStorage.getItem(loginId)){await bearer();remoteRow=await readRemote();if(meta&&remoteRow&&remoteRow.revision!==meta.rev&&memory&&await digest(memory)===meta.hash){const data=await openPacket(remoteRow.payload);JSON.parse(data);localStorage.setItem(stateId,remoteRow.payload);memory=data;meta={rev:remoteRow.revision,hash:await digest(data)};localStorage.setItem(metaId,JSON.stringify(meta))}await inspect()}else message('Nur lokal gespeichert. Online-Sync ist freiwillig.')}catch(e){settings();warn(e)}}
function bind(id,fn){cs(id).onclick=async()=>{if(activity||busy)return;activity++;cs(id).disabled=true;try{await fn()}catch(e){warn(e)}finally{activity--;cs(id).disabled=false}}}
bind('mail',async()=>{let email=cs('email').value.trim();if(!cs('email').reportValidity())return;await request('/auth/v1/otp','POST',{email,create_user:false});message('Prüfe dein Postfach. Kopiere den Anmeldelink aus der E-Mail hierher oder gib den zugestellten Code ein.')});
bind('verify',async()=>{const value=cs('proof').value.trim(),email=cs('email').value.trim();let body;if(/^\d{6,10}$/.test(value)){body={email,token:value,type:'email'}}else{let link;try{link=new URL(value)}catch{return message('Gib den Code oder den vollständigen Supabase-Anmeldelink ein.')}if(link.origin!==api||link.pathname!=='/auth/v1/verify'||!link.searchParams.get('token'))return message('Dieser Link gehört nicht zur Atelier-Anmeldung. Kopiere den ursprünglichen Link aus der E-Mail.');body={token_hash:link.searchParams.get('token'),type:'email'}}await afterLogin(await request('/auth/v1/verify','POST',body))});
bind('upload',upload);bind('pull',takeRemote);bind('check',inspect);bind('disconnect',async()=>{if(!confirm('Online-Sync auf diesem Gerät ausschalten? Die Online-Kopie bleibt erhalten.'))return;clearTimeout(timer);localStorage.removeItem(metaId);localStorage.removeItem(loginId);meta=null;session=null;remoteRow=null;blocked=false;settings();message('Nur lokal gespeichert.')});
window.addEventListener('online',()=>{if(session)inspect().catch(warn)});window.addEventListener('focus',()=>{if(session&&!busy&&!activity)inspect().catch(warn)});
</script></html>
